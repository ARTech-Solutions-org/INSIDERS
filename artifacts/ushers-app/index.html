<html lang="ar">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

  <meta name="description" content="INSIDERS — We Command The Crowd." />

  <!-- PWA / Theme -->
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS PWA (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="INSIDERS" />
  <link rel="apple-touch-icon" href="/insiders-logo.png?v=3" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json?v=3" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="INSIDERS" />
  <meta property="og:description" content="INSIDERS — We Command The Crowd." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="INSIDERS" />
  <meta name="twitter:description" content="INSIDERS — We Command The Crowd." />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="splash-screen" style="position: fixed; inset: 0; background-color: #f5f3f0; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.4s ease;">
    <video id="splash-video" src="/splash.mp4" muted autoplay playsinline style="width: 100vw; max-width: 100%; object-fit: contain; pointer-events: none;"></video>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    (function() {
      var splash = document.getElementById('splash-screen');
      
      // Only show splash on first open (new session), not on refresh
      if (sessionStorage.getItem('splash_shown')) {
        if (splash) splash.remove();
        return;
      }
      sessionStorage.setItem('splash_shown', '1');

      var video = document.getElementById('splash-video');
      var isHidden = false;
      
      function hideSplash() {
        if (isHidden || !splash) return;
        isHidden = true;
        splash.style.opacity = '0';
        setTimeout(function() { if (splash) splash.remove(); }, 400);
      }

      if (video) {
        video.addEventListener('ended', hideSplash);
        setTimeout(hideSplash, 5000);
        video.play().catch(function() { hideSplash(); });
      } else {
        hideSplash();
      }
    })();
  </script>
</body>

</html>
