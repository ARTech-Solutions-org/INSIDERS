openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────────────
  /auth/usher/register:
    post:
      operationId: registerUsher
      summary: Register a new usher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsherRegistration"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Bad request

  /auth/usher/login:
    post:
      operationId: loginUsher
      summary: Usher login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Unauthorized

  /auth/admin/login:
    post:
      operationId: loginAdmin
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResult"
        "401":
          description: Unauthorized

  /auth/me:
    get:
      operationId: getMe
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      summary: Logout
      responses:
        "200":
          description: OK

  # ─── USHERS ──────────────────────────────────────────────────────────────
  /ushers:
    get:
      operationId: listUshers
      summary: List all ushers (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsherListResponse"

  /ushers/me:
    get:
      operationId: getMyUsherProfile
      summary: Get authenticated usher's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsherProfile"
    patch:
      operationId: updateMyUsherProfile
      summary: Update authenticated usher's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsherUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsherProfile"

  /ushers/{id}:
    get:
      operationId: getUsher
      summary: Get usher by ID (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsherProfile"
        "404":
          description: Not found

  /ushers/{id}/status:
    patch:
      operationId: updateUsherStatus
      summary: Approve or decline usher (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsherStatusUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsherProfile"

  # ─── USHER DOCUMENTS ─────────────────────────────────────────────────────
  /ushers/me/documents:
    get:
      operationId: listMyDocuments
      summary: List documents for the authenticated usher
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsherDocument"
    post:
      operationId: addMyDocument
      summary: Add document for authenticated usher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsherDocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsherDocument"

  /ushers/{id}/documents:
    get:
      operationId: listUsherDocuments
      summary: List usher documents (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsherDocument"

  # ─── USHER SKILLS ────────────────────────────────────────────────────────
  /ushers/me/skills:
    get:
      operationId: listMySkills
      summary: List skills for authenticated usher
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsherSkill"
    post:
      operationId: addMySkill
      summary: Add skill for authenticated usher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsherSkillInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsherSkill"

  /ushers/me/skills/{skillId}:
    delete:
      operationId: deleteMySkill
      summary: Remove skill from authenticated usher
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── USHER AVAILABILITY ──────────────────────────────────────────────────
  /ushers/me/availability:
    get:
      operationId: listMyAvailability
      summary: List availability for authenticated usher
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsherAvailability"
    post:
      operationId: setMyAvailability
      summary: Set availability date for authenticated usher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsherAvailabilityInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsherAvailability"

  # ─── EVENTS ──────────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      summary: List events
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: upcoming
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
    post:
      operationId: createEvent
      summary: Create event (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      summary: Get event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          description: Not found
    patch:
      operationId: updateEvent
      summary: Update event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      summary: Delete event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{id}/deduction-rules:
    get:
      operationId: listDeductionRules
      summary: List deduction rules for event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeductionRule"
    post:
      operationId: createDeductionRule
      summary: Create deduction rule (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeductionRuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeductionRule"

  /events/{id}/deduction-rules/{ruleId}:
    delete:
      operationId: deleteDeductionRule
      summary: Delete deduction rule (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{id}/holder-link:
    get:
      operationId: getEventHolderLink
      summary: Get or create event holder link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHolderLink"
    post:
      operationId: createEventHolderLink
      summary: Generate event holder link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHolderLink"

  /events/holder/{token}:
    get:
      operationId: getEventByHolderToken
      summary: Get event info by holder token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHolderView"
        "404":
          description: Not found

  # ─── EVENT ASSIGNMENTS ───────────────────────────────────────────────────
  /events/{id}/assignments:
    get:
      operationId: listEventAssignments
      summary: List assignments for an event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventAssignment"
    post:
      operationId: assignUsherToEvent
      summary: Assign usher to event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAssignment"

  /events/{id}/assignments/{assignmentId}:
    delete:
      operationId: removeAssignment
      summary: Remove assignment (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{id}/assignments/{assignmentId}/checkin:
    post:
      operationId: adminCheckin
      summary: Admin/coordinator manual check-in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAssignment"

  /events/{id}/assignments/{assignmentId}/checkout:
    post:
      operationId: adminCheckout
      summary: Admin/coordinator manual check-out
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAssignment"

  /events/{id}/smart-candidates:
    get:
      operationId: getSmartCandidates
      summary: Get ranked usher candidates for event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: skills
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsherCandidate"

  # ─── WAITLIST ─────────────────────────────────────────────────────────────
  /events/{id}/waitlist:
    get:
      operationId: listWaitlist
      summary: List waitlist for event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WaitlistEntry"
    post:
      operationId: addToWaitlist
      summary: Add usher to waitlist (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"

  # ─── MY ASSIGNMENTS (USHER) ───────────────────────────────────────────────
  /my/assignments:
    get:
      operationId: listMyAssignments
      summary: List usher's own assignments
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyAssignment"

  /my/assignments/{assignmentId}/accept:
    post:
      operationId: acceptAssignment
      summary: Accept an event assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAssignment"

  /my/assignments/{assignmentId}/decline:
    post:
      operationId: declineAssignment
      summary: Decline an event assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAssignment"

  /my/assignments/{assignmentId}/checkin:
    post:
      operationId: usherCheckin
      summary: Usher GPS check-in
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GpsCheckinInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAssignment"
        "400":
          description: Out of range or time window error

  /my/assignments/{assignmentId}/checkout:
    post:
      operationId: usherCheckout
      summary: Usher GPS check-out
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GpsCheckinInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAssignment"

  /my/assignments/{assignmentId}/cancel:
    post:
      operationId: cancelAssignment
      summary: Usher cancels accepted assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResult"

  # ─── BALANCE & PAYOUTS (USHER) ────────────────────────────────────────────
  /my/balance:
    get:
      operationId: getMyBalance
      summary: Get usher's current balance and recent transactions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSummary"

  /my/transactions:
    get:
      operationId: listMyTransactions
      summary: List balance transactions for authenticated usher
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceTransaction"

  /my/payouts:
    get:
      operationId: listMyPayouts
      summary: List payout history for authenticated usher
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payout"

  # ─── RATINGS ─────────────────────────────────────────────────────────────
  /ratings:
    post:
      operationId: createRating
      summary: Submit rating for a usher on an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"

  /ratings/holder/{token}:
    post:
      operationId: submitHolderRating
      summary: Event holder submits rating via token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HolderRatingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"

  /my/ratings:
    get:
      operationId: listMyRatings
      summary: List ratings for authenticated usher
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rating"

  # ─── NOTIFICATIONS ────────────────────────────────────────────────────────
  /my/notifications:
    get:
      operationId: listMyNotifications
      summary: List notifications for authenticated user
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /my/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      responses:
        "200":
          description: OK

  /my/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Mark a notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  # ─── ADMIN — BALANCE / PAYOUTS ────────────────────────────────────────────
  /admin/transactions:
    get:
      operationId: listAllTransactions
      summary: List all balance transactions (admin)
      parameters:
        - name: usherId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceTransaction"
    post:
      operationId: createTransaction
      summary: Admin manually adjusts usher balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceTransaction"

  /admin/payouts:
    get:
      operationId: listAllPayouts
      summary: List all payouts (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: usherId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payout"
    post:
      operationId: createPayout
      summary: Create payout for usher (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"

  /admin/payouts/{id}/status:
    patch:
      operationId: updatePayoutStatus
      summary: Update payout status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutStatusUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"

  # ─── ADMIN — ADMINS ───────────────────────────────────────────────────────
  /admins:
    get:
      operationId: listAdmins
      summary: List all admin accounts (super admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProfile"
    post:
      operationId: createAdmin
      summary: Create new admin account (super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"

  /admins/{id}:
    patch:
      operationId: updateAdmin
      summary: Update admin role (super admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
    delete:
      operationId: deleteAdmin
      summary: Delete admin account (super admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── BROADCAST MESSAGES ───────────────────────────────────────────────────
  /broadcasts:
    get:
      operationId: listBroadcasts
      summary: List broadcast messages (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BroadcastMessage"
    post:
      operationId: sendBroadcast
      summary: Send broadcast message (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastMessage"

  # ─── AUDIT LOG ────────────────────────────────────────────────────────────
  /audit-log:
    get:
      operationId: listAuditLog
      summary: List audit log entries (admin)
      parameters:
        - name: adminId
          in: query
          schema:
            type: integer
        - name: actionType
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  # ─── DOCUMENT EXPIRY ──────────────────────────────────────────────────────
  /admin/expiring-documents:
    get:
      operationId: listExpiringDocuments
      summary: List documents expiring within 30 days or already expired (admin)
      parameters:
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpiringDocument"

  # ─── DASHBOARD ────────────────────────────────────────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: Get admin dashboard overview stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /admin/usher-stats/{id}:
    get:
      operationId: getUsherStats
      summary: Get per-usher performance stats (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsherStats"

  /admin/event-stats/{id}:
    get:
      operationId: getEventStats
      summary: Get per-event performance stats (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStats"

  # ─── COORDINATOR ──────────────────────────────────────────────────────────
  /coordinator/today:
    get:
      operationId: getCoordinatorEvents
      summary: Get today's events for coordinator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoordinatorEvent"

