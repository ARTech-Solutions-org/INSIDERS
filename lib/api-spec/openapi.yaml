            properties:
              month:
                type: string
              eventCount:
                type: integer
              completedCount:
                type: integer

    # ─── COORDINATOR ──────────────────────────────────────────────────────
    CoordinatorEvent:
      type: object
      required: [id, title, startTime, endTime, status, assignments]
      properties:
        id:
          type: integer
        title:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/EventAssignment"
